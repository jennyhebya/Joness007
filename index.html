    <style>
        :root {
            --primary-color: #d90429;
            --primary-hover: #ef233c;
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --overlay-dark: rgba(0, 0, 0, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #111;
            color: var(--text-white);
            overflow-x: hidden;
        }

        body {
            margin: 0;
            position: relative;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .layout {
            min-height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-block {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .steps-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 11;
            text-align: center;
        }

        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            background-color: #000;
        }

        .bg::after {
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.85) 80%);
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .bg-stage {
            width: 100%;
            animation: bgScroll 60s linear infinite;
        }

        .bg-stage img {
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: cover;
        }

        @keyframes bgScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-33.333%); }
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 40px 25px;
            
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .alert-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .step-title {
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .step-subtitle {
            font-size: 18px;
            line-height: 1.5;
            color: var(--text-gray);
            margin-bottom: 10px;
            font-weight: 400;
        }

        .step-subtitle strong {
            color: var(--primary-color);
            font-weight: 700;
        }

        .btns-wrap {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            max-width: 280px;
            padding: 16px 20px;
            background: linear-gradient(45deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 4, 41, 0.6);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(217, 4, 41, 0.3);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .btn:hover::after {
            left: 100%;
        }

        @media (max-width: 480px) {
            .steps-wrap {
                padding: 15px;
            }
            .step-item {
                padding: 30px 20px;
            }
            .step-title {
                font-size: 24px;
            }
            .step-subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="bg">
        <div class="bg-stage">

            <img src="https://pbs.twimg.com/media/HJzDdSUaEAAZIEW?format=jpg&name=large" alt="Background">
            <img src="https://pbs.twimg.com/media/HJzDdSYa0AApoD2?format=jpg&name=large" alt="Background">
        </div>
    </div>

    <div class="layout">
        <main class="main-block">
            <div class="steps-wrap">
                <div class="steps">
                    <div class="steps-content">
                        <div class="step-item is-active">
                            <div class="alert-icon">⚠️</div>
                            
                            <h2 class="step-title">Attention!</h2>
                            <p class="step-subtitle">wants to exchange candid photos with you.</p>
                            <p class="step-subtitle">You confirm?</p>
                            
                            <div class="btns-wrap">
                                <a class="btn" href="https://KpEl41d.gemblong.sbs/KqTh0qLkMYtGAN37RPIt" id="offerLink">
                                    YES
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
